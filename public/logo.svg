<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#waterGrad)" opacity="0.9"/>
  
  <!-- Water Drop Shape -->
  <path d="M50 15 C50 15 25 45 25 62 C25 78 36 88 50 88 C64 88 75 78 75 62 C75 45 50 15 50 15 Z" 
        fill="white" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Inner Water Wave -->
  <path d="M32 62 Q40 55 50 62 Q60 69 68 62" 
        fill="none" stroke="url(#waterGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M35 70 Q45 63 55 70 Q65 77 72 70" 
        fill="none" stroke="url(#waterGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Shield Symbol inside drop -->
  <path d="M50 38 L60 44 L60 54 Q60 62 50 67 Q40 62 40 54 L40 44 Z" 
        fill="url(#shieldGrad)" opacity="0.8"/>
  
  <!-- AI Circuit Pattern -->
  <circle cx="50" cy="50" r="4" fill="white"/>
  <line x1="50" y1="46" x2="50" y2="42" stroke="white" stroke-width="1.5"/>
  <line x1="46" y1="50" x2="42" y2="50" stroke="white" stroke-width="1.5"/>
  <line x1="54" y1="50" x2="58" y2="50" stroke="white" stroke-width="1.5"/>
  <line x1="50" y1="54" x2="50" y2="58" stroke="white" stroke-width="1.5"/>
  
  <!-- Small sparkle dots -->
  <circle cx="35" cy="35" r="2" fill="white" opacity="0.6"/>
  <circle cx="65" cy="40" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="45" cy="25" r="1" fill="white" opacity="0.4"/>
</svg>
